        // 宠物手动控制逻辑更新
        function handleManualPetControl(petRoot, delta, maxSpeed = 3.2) {
            let inputX = 0;
            let inputZ = 0;
            if (moveInput.forward) inputZ -= 1;
            if (moveInput.backward) inputZ += 1;
            if (moveInput.left) inputX -= 1;
            if (moveInput.right) inputX += 1;

            if (inputX === 0 && inputZ === 0) return false;

            const len = Math.sqrt(inputX * inputX + inputZ * inputZ);
            inputX /= len;
            inputZ /= len;

            const camForward = _v3A;
            camera.getWorldDirection(camForward);
            camForward.y = 0;
            camForward.normalize();

            const camRight = _v3B;
            camRight.crossVectors(camForward, _v3Up).normalize();

            const moveDir = _v3C.set(0, 0, 0)
                .addScaledVector(camForward, -inputZ)
                .addScaledVector(camRight, inputX)
                .normalize();

            const moveStep = maxSpeed * delta;
            let nextX = petRoot.position.x + moveDir.x * moveStep;
            let nextZ = petRoot.position.z + moveDir.z * moveStep;

            nextX = Math.max(-30, Math.min(28, nextX));
            nextZ = Math.max(-4, Math.min(24, nextZ));

            petRoot.position.x = nextX;
            petRoot.position.z = nextZ;

            const targetAngle = Math.atan2(moveDir.x, moveDir.z);
            let angleDiff = targetAngle - petRoot.rotation.y;
            while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
            while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
            petRoot.rotation.y += angleDiff * 0.2;

            return true;
        }

        function processPointerRaycast() {
            const now = performance.now();
            if (!pendingPointerEvent || now - lastRaycastTime < 100) return;
            lastRaycastTime = now;
            const e = pendingPointerEvent;
            pendingPointerEvent = null;

            raycaster.setFromCamera(mouse, camera);
            const petObjects = [dogRoot, catRoot, characterRoot, ...chickens.map(c => c.mesh)];
            const petIntersects = raycaster.intersectObjects(petObjects, true);

            if (petIntersects.length > 0) {
                container.style.cursor = 'pointer';
                const hitObj = petIntersects[0].object;
                let petName = "🐾 宠物互动";
                if (hitObj.userData && hitObj.userData.petKey === 'DOG') {
                    petName = "🐶 小四";
                } else if (hitObj.userData && hitObj.userData.petKey === 'CAT') {
                    petName = "🐱 小灰灰";
                } else if (hitObj.userData && hitObj.userData.petKey === 'CHARACTER') {
                    petName = "🐯 小虎哥";
                } else if (hitObj.userData && hitObj.userData.chickenName) {
                    petName = `🐓 ${hitObj.userData.chickenName}`;
                } else {
                    let p = hitObj.parent;
                    while (p) {
                        if (p.userData && p.userData.chickenName) {
                            petName = `🐓 ${p.userData.chickenName}`;
                            break;
                        }

        // 7. 渲染与主循环
        let clock = new THREE.Clock();

        function animate(time) {
            requestAnimationFrame(animate);

            // 页面不可见时暂停渲染，降低后台耗电
            if (!isPageVisible) return;

            // 基于 delta-time 的帧率限制：移动端 30fps / 桌面端 60fps
            if (time - lastFrameTime < FRAME_INTERVAL) return;
            lastFrameTime = time;

            TWEEN.update(time);

            const delta = Math.min(clock.getDelta(), 0.1);
            const elapsed = clock.getElapsedTime();

            processPointerRaycast();

            if (isTimeRunning) {
                currentHour = (currentHour + delta * 0.5) % 24;
                bottomTimeSlider.value = currentHour;
                // 自动流转时天空/光照每 100ms 更新一次，避免每帧重算
                const now = performance.now();
                if (now - lastSkyUpdateTime > 100) {
                    lastSkyUpdateTime = now;
                    updateSkyAndLighting(currentHour);
                }
            }

            starShaderMat.uniforms.uTime.value = elapsed;

            if (sunGroup.visible) {
                sunGroup.rotation.y = elapsed * 0.4;
                sunGroup.rotation.z = elapsed * 0.2;
            }

            if (cloudGroup.visible) {
                clouds.forEach(c => {
                    c.position.x += c.userData.speed * delta;
                    if (c.position.x > 38) c.position.x = -42;
                });
            }

            if (rainbowGroup.visible) {
                const pulse = 0.65 + Math.sin(elapsed * 1.5) * 0.06;
                rainbowGroup.children.forEach(mesh => mesh.material.opacity = pulse);
            }

            if (isBirdsFlying) {
                birdFlightProgress += delta * 7.5;
                const bx = -26 + birdFlightProgress;
                const by = 14.5 + Math.sin(birdFlightProgress * 0.25) * 1.2;
                const bz = -4 + birdFlightProgress * 0.45;
                
                bird1.position.set(bx, by, bz);
                bird2.position.set(bx - 2.5, by + 0.6, bz + 1.2);

                const wingAngle = Math.sin(elapsed * 22) * 0.5;
                bird1.userData.leftWing.rotation.z = wingAngle;
                bird1.userData.rightWing.rotation.z = -wingAngle;
                bird2.userData.leftWing.rotation.z = wingAngle;
                bird2.userData.rightWing.rotation.z = -wingAngle;

                if (bx > 28) {
                    isBirdsFlying = false;
                    birdsGroup.visible = false;
                }
            }

            if (currentWeather === 'FIREWORK') {
                fireworkTimer += delta;
                if (fireworkTimer > 1.2) {
                    fireworkTimer = 0;
                    const fx = -2 + (Math.random() - 0.5) * 8;
                    // 绽放位置整体抬高，让烟花在屋顶上方更舒展
                    const fy = 19.0 + Math.random() * 4.5;
                    const fz = 1.0 + (Math.random() - 0.5) * 5;
                    spawnFireworkExplosion(fx, fy, fz);
                }
            }

            if (currentWeather === 'METEOR') {
                meteorRainTimer += delta;
                if (meteorRainTimer > (isMobile ? 0.6 : 0.4)) {
                    meteorRainTimer = 0;
                    spawnMeteor(true);
                }
            }

            for (let i = activeFireworks.length - 1; i >= 0; i--) {
                const fw = activeFireworks[i];
                fw.life -= delta;
                if (fw.life <= 0) {
                    // 对象池回收，不销毁几何体/材质
                    fw.active = false;
                    fw.mesh.visible = false;
                    activeFireworks.splice(i, 1);
                } else {
                    const progress = fw.life / fw.maxLife;
                    fw.mesh.material.opacity = Math.pow(progress, 1.5);
                    for (let j = 0; j < fireworkParticleCount; j++) {
                        const p = fw.particles[j];
                        p.x += p.vx * delta;
                        p.y += p.vy * delta;
                        p.z += p.vz * delta;
                        p.vy -= 9.8 * 0.45 * delta;
                        p.vx *= 0.95; p.vy *= 0.95; p.vz *= 0.95;

                        dummy.position.set(p.x, p.y, p.z);
                        dummy.rotation.set(elapsed * 2 + j, elapsed * 2 + j, 0);
                        dummy.updateMatrix();
                        fw.mesh.setMatrixAt(j, dummy.matrix);
                    }
                    fw.mesh.instanceMatrix.needsUpdate = true;
                }
            }

            if (rainLines.visible) {
                const rPos = rainGeo.attributes.position.array;
                for (let i = 0; i < rainCount; i++) {
                    rPos[i * 6 + 1] -= 85 * delta;
                    rPos[i * 6 + 4] -= 85 * delta;
                    if (rPos[i * 6 + 1] < -2) {
                        rPos[i * 6 + 1] = 55 + Math.random() * 5;
                        rPos[i * 6 + 4] = rPos[i * 6 + 1] - 2;
                    }
                }
                rainGeo.attributes.position.needsUpdate = true;
            }

            if (snowParticles.visible) {
                const sPos = snowGeo.attributes.position.array;
                for (let i = 0; i < snowCount; i++) {
                    sPos[i * 3 + 1] -= snowVel[i].vy * delta;
                    sPos[i * 3]     += (snowVel[i].vx + Math.sin(elapsed + i) * 0.8) * delta;
                    if (sPos[i * 3 + 1] < -1) {
                        sPos[i * 3 + 1] = 50 + Math.random() * 5;
                        sPos[i * 3]     = (Math.random() - 0.5) * 120;
                    }
                }
                snowGeo.attributes.position.needsUpdate = true;
            }

            const isNight = (currentHour >= 19.5 || currentHour <= 5.0);
            if (isNight && currentWeather !== 'RAINY' && currentWeather !== 'FIREWORK' && currentWeather !== 'METEOR') {
                meteorSpawnTimer += delta;
                if (meteorSpawnTimer > (isMobile ? 3.5 : 2.5) && Math.random() < (isMobile ? 0.25 : 0.35)) {
                    spawnMeteor(false);
                    meteorSpawnTimer = 0;
                }
            }

            for (let i = meteors.length - 1; i >= 0; i--) {
                const m = meteors[i];
                const u = m.userData;
                u.life -= delta * 1.1;
                if (u.life <= 0) {
                    // 流星对象池回收，不销毁几何体/材质
                    u.active = false;
                    m.visible = false;
                    meteors.splice(i, 1);
                } else {
                    u.pos.addScaledVector(u.dir, u.speed * delta);
                    updateMeteorGeometry(m);
                    m.material.opacity = Math.sin((u.life / u.maxLife) * Math.PI) * 0.95;
                }
            }

            if (starShaderMat.uniforms.uGlobalOpacity.value > 0.05) {
                starField.rotation.y = elapsed * 0.003;
            }

            // 更新小狗（自动巡逻 vs 玩家遥控）
            let isDogMoving = false;
            if (cameraMode === 'CONTROL_DOG') {
                isDogMoving = handleManualPetControl(dogRoot, delta, 3.4);
            } else {
                isDogMoving = dogAI.update(delta);
            }

            if (isDogMoving) {
                const speed = 12.0;
                dogLegFL.rotation.x = Math.sin(elapsed * speed) * 0.5;
                dogLegBR.rotation.x = Math.sin(elapsed * speed) * 0.5;
                dogLegFR.rotation.x = -Math.sin(elapsed * speed) * 0.5;
                dogLegBL.rotation.x = -Math.sin(elapsed * speed) * 0.5;
            } else {
                dogLegFL.rotation.x = 0; dogLegFR.rotation.x = 0;
                dogLegBL.rotation.x = 0; dogLegBR.rotation.x = 0;
            }
            dogRoot.position.y = EXACT_GROUND_Y + (dogRoot.userData.jumpOffset || 0);
            dogTail.rotation.y = Math.sin(elapsed * 12) * 0.4;
            dogHead.rotation.x = Math.sin(elapsed * 2.5) * 0.025;

            // 更新小猫（自动巡逻 vs 玩家遥控）
            let isCatMoving = false;
            if (cameraMode === 'CONTROL_CAT') {
                isCatMoving = handleManualPetControl(catRoot, delta, 2.6);
            } else {
                isCatMoving = catAI.update(delta);
            }

            if (isCatMoving) {
                const speed = 8.5;
                catLegFL.rotation.x = Math.sin(elapsed * speed) * 0.45;
                catLegBR.rotation.x = Math.sin(elapsed * speed) * 0.45;
                catLegFR.rotation.x = -Math.sin(elapsed * speed) * 0.45;
                catLegBL.rotation.x = -Math.sin(elapsed * speed) * 0.45;
            } else {
                catLegFL.rotation.x = 0; catLegFR.rotation.x = 0;
                catLegBL.rotation.x = 0; catLegBR.rotation.x = 0;
            }
            catRoot.position.y = EXACT_GROUND_Y + (catRoot.userData.jumpOffset || 0);
            catTail.rotation.y = Math.sin(elapsed * 3.5) * 0.25;
            catHead.rotation.y = Math.sin(elapsed * 2.0) * 0.08;

            // 更新鸡群行走与啄米
            updateChickens(delta, elapsed);

            // 更新角色
            let isCharacterMoving = false;
            if (cameraMode === 'CONTROL_CHARACTER') {
                isCharacterMoving = handleManualPetControl(characterRoot, delta, 3.0);
            }
            updateCharacterAnimation(elapsed, delta, isCharacterMoving);

            // 摄像机镜头平滑平移跟踪（复用临时向量，避免每帧分配）
            _v3B.copy(camera.position).sub(controls.target);
            if (cameraMode === 'CONTROL_DOG') {
                _v3A.set(dogRoot.position.x, EXACT_GROUND_Y + 0.4, dogRoot.position.z);
                controls.target.lerp(_v3A, 0.08);
                camera.position.copy(controls.target).add(_v3B);
            } else if (cameraMode === 'CONTROL_CAT') {
                _v3A.set(catRoot.position.x, EXACT_GROUND_Y + 0.4, catRoot.position.z);
                controls.target.lerp(_v3A, 0.08);
                camera.position.copy(controls.target).add(_v3B);
            } else if (cameraMode === 'TRACK_CHICKEN') {
                _v3A.set(leaderMesh.position.x, EXACT_GROUND_Y + 0.35, leaderMesh.position.z);
                controls.target.lerp(_v3A, 0.08);
                camera.position.copy(controls.target).add(_v3B);
            } else if (cameraMode === 'CONTROL_CHARACTER') {
                _v3A.set(characterRoot.position.x, EXACT_GROUND_Y + 0.9, characterRoot.position.z);
                controls.target.lerp(_v3A, 0.08);
                camera.position.copy(controls.target).add(_v3B);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // 页面可见性变化：切出时暂停渲染循环，切回时重置时间戳避免跳帧
        document.addEventListener('visibilitychange', () => {
            isPageVisible = document.visibilityState === 'visible';
            if (isPageVisible) {
                lastFrameTime = performance.now();
            }
        });

        animate();
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>体素茶山民宿 - 24小时昼夜星空与宠物遥控系统</title>
    <style>
        @font-face {
            font-family: 'Zpix';
            src: url('zpix-subset.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { width: 100vw; height: 100vh; overflow: hidden; background: #0b111e; font-family: 'Zpix', "NSimSun", "SimSun", "Courier New", "SimHei", "Microsoft YaHei", "PingFang SC", monospace; }
        #canvas-box { width: 100%; height: 100%; display: block; }
        
        /* 顶部悬浮体素功能栏 */
        .voxel-dock {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
            flex-wrap: wrap;
            max-width: calc(100vw - 40px);
        }

        /* 体素图标按钮外观 */
        .v-btn {
            position: relative;
            width: 44px;
            height: 44px;
            background: rgba(15, 23, 42, 0.75);
            border: 2px solid rgba(255, 255, 255, 0.18);
            border-radius: 4px;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.6), 0 8px 16px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
            image-rendering: pixelated;
            touch-action: manipulation;
        }

        .v-btn:hover {
            transform: translateY(-3px);
            border-color: #38bdf8;
            background: rgba(15, 23, 42, 0.95);
            box-shadow: 0 7px 0 rgba(0, 0, 0, 0.6), 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .v-btn:active, .v-btn.pressed {
            transform: translateY(2px) !important;
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.6), 0 0 10px rgba(56, 189, 248, 0.6) !important;
            background: rgba(56, 189, 248, 0.3) !important;
            border-color: #38bdf8 !important;
        }

        .v-btn.active {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.22);
            box-shadow: 0 4px 0 #0284c7, 0 0 16px rgba(56, 189, 248, 0.6);
        }

        /* 中央圆形跳跃按钮特殊样式 */
        .v-btn-round {
            border-radius: 50% !important;
            border-color: rgba(250, 204, 21, 0.45) !important;
            background: rgba(15, 23, 42, 0.85);
            box-shadow: 0 4px 0 #b45309, 0 0 12px rgba(250, 204, 21, 0.25) !important;
        }
        .v-btn-round:hover {
            border-color: #facc15 !important;
            box-shadow: 0 6px 0 #b45309, 0 0 16px rgba(250, 204, 21, 0.5) !important;
        }
        .v-btn-round:active, .v-btn-round.pressed {
            transform: translateY(2px) !important;
            border-color: #facc15 !important;
            background: rgba(250, 204, 21, 0.25) !important;
            box-shadow: 0 1px 0 #b45309, 0 0 12px rgba(250, 204, 21, 0.6) !important;
        }

        /* 气泡提示 (Tooltip) */
        .v-btn::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: -32px;
            left: 50%;
            transform: translateX(-50%) scale(0.85);
            background: #0f172a;
            color: #f1f5f9;
            font-size: 0.7rem;
            padding: 3px 7px;
            border: 1px solid #38bdf8;
            border-radius: 3px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: all 0.15s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            z-index: 100;
            font-family: 'Zpix', "NSimSun", "SimSun", "Courier New", "SimHei", "Microsoft YaHei", "PingFang SC", monospace;
        }
        .v-btn:hover::after {
            opacity: 1;
            transform: translateX(-50%) scale(1);
            bottom: -36px;
        }

        /* 像素网格画布 10x10 */
        .pixel-grid {
            display: grid;
            grid-template-columns: repeat(10, 2px);
            grid-template-rows: repeat(10, 2px);
            gap: 1px;
            pointer-events: none;
        }
        .px {
            width: 2px;
            height: 2px;
            background: transparent;
        }

        /* 像素色彩定义 */
        .c-sun { background: #facc15; }
        .c-org { background: #fb923c; }
        .c-wht { background: #f8fafc; }
        .c-gry { background: #94a3b8; }
        .c-red { background: #ef4444; }
        .c-grn { background: #22c55e; }
        .c-blu { background: #38bdf8; }
        .c-pur { background: #a855f7; }
        .c-pnk { background: #ec4899; }
        .c-dog { background: #d97706; }
        .c-cat { background: #64748b; }
        .c-eyd { background: #0f172a; }
        .c-amb { background: #f59e0b; }
        .c-drk { background: #334155; }
        .c-chk { background: #f8fafc; }

        /* 底部悬浮极简时间进度条 */
        .voxel-timebar-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            background: transparent;
            z-index: 10;
            width: auto;
            max-width: 90vw;
        }

        .v-play-btn {
            width: 36px;
            height: 36px;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.18);
            border-radius: 4px;
            box-shadow: 0 3px 0 rgba(0, 0, 0, 0.6);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            flex-shrink: 0;
        }
        .v-play-btn:hover {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.5);
        }
        .v-play-btn:active {
            transform: translateY(1px);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.5);
        }
        .v-play-btn.active {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.25);
            box-shadow: 0 3px 0 #0284c7, 0 0 10px rgba(56, 189, 248, 0.5);
        }

        .voxel-time-text {
            font-family: 'Zpix', "NSimSun", "SimSun", "Courier New", "SimHei", "Microsoft YaHei", "PingFang SC", monospace;
            font-size: 0.95rem;
            font-weight: 700;
            color: #facc15;
            min-width: 48px;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8), 0 0 8px rgba(250, 204, 21, 0.5);
            background: rgba(15, 23, 42, 0.75);
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            flex-shrink: 0;
        }

        .voxel-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 220px;
            height: 8px;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.18);
            border-radius: 4px;
            outline: none;
            cursor: pointer;
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.5);
        }

        .voxel-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 20px;
            background: #38bdf8;
            border: 2px solid #ffffff;
            border-radius: 2px;
            box-shadow: 0 2px 0 #0284c7, 0 0 8px rgba(56, 189, 248, 0.6);
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .voxel-slider::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            background: #7dd3fc;
        }

        .voxel-slider::-moz-range-thumb {
            width: 14px;
            height: 20px;
            background: #38bdf8;
            border: 2px solid #ffffff;
            border-radius: 2px;
            box-shadow: 0 2px 0 #0284c7;
            cursor: pointer;
        }

        /* 纯悬浮体素方向与圆形跳跃控制器 */
        .voxel-dpad-container {
            position: absolute;
            bottom: 24px;
            right: 24px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 25;
            background: transparent;
            padding: 0;
            border: none;
            box-shadow: none;
        }

        .dpad-row {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
        }

        /* 气泡与指示器 */
        .pet-bubble {
            position: absolute;
            background: rgba(15, 23, 42, 0.95);
            border: 3px solid #38bdf8;
            border-radius: 0;
            padding: 6px 12px;
            font-size: 0.9rem;
            color: #facc15;
            font-family: 'Zpix', "NSimSun", "SimSun", "Courier New", "SimHei", "Microsoft YaHei", "PingFang SC", monospace;
            font-weight: 700;
            pointer-events: none;
            box-shadow: 4px 4px 0 #0f172a, 6px 6px 0 #38bdf8;
            transform: translate(-50%, -100%);
            opacity: 0;
            transition: transform 0.6s cubic-bezier(0.18, 0.89, 0.32, 1.28), opacity 0.6s ease;
            z-index: 30;
            image-rendering: pixelated;
            text-shadow: 2px 2px 0 #0f172a;
            line-height: 1.4;
            max-width: 280px;
            text-align: center;
            white-space: normal;
            word-break: break-word;
        }
        .pet-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 10px solid #38bdf8;
        }

        #tooltip {
            position: absolute; display: none; background: rgba(15, 23, 42, 0.95);
            border: 2px solid #38bdf8; color: #fff; padding: 5px 12px;
            border-radius: 0; font-size: 0.8rem; pointer-events: none; z-index: 40;
            box-shadow: 3px 3px 0 #0f172a, 5px 5px 0 #38bdf8;
            font-family: 'Zpix', "NSimSun", "SimSun", "Courier New", "SimHei", "Microsoft YaHei", "PingFang SC", monospace;
            image-rendering: pixelated;
            text-shadow: 1px 1px 0 #0f172a;
        }

        @media (max-width: 768px) {
            .voxel-dock { top: 12px; left: 12px; gap: 6px; }
            .v-btn { width: 38px; height: 38px; }
            .pixel-grid { transform: scale(0.9); }
            .voxel-timebar-container { bottom: 14px; width: auto; justify-content: center; }
            .voxel-slider { width: 140px; }
            .voxel-dpad-container { bottom: 70px; right: 14px; gap: 6px; }
            .dpad-row { gap: 6px; }
        }

        /* 地图导航选择弹窗 */
        .map-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            backdrop-filter: blur(2px);
        }
        .map-modal-overlay.active {
            display: flex;
        }
        .map-modal {
            background: rgba(15, 23, 42, 0.98);
            border: 3px solid #38bdf8;
            border-radius: 0;
            padding: 20px 24px 18px;
            max-width: 320px;
            width: 86vw;
            box-shadow: 6px 6px 0 #0f172a, 8px 8px 0 #38bdf8;
            font-family: 'Zpix', "NSimSun", "SimSun", "Courier New", "SimHei", "Microsoft YaHei", "PingFang SC", monospace;
            text-align: center;
        }
        .map-modal-title {
            font-size: 1.05rem;
            color: #facc15;
            margin-bottom: 8px;
            text-shadow: 2px 2px 0 #0f172a;
        }
        .map-modal-address {
            font-size: 0.78rem;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 16px;
            word-break: break-all;
        }
        .map-modal-btns {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .map-modal-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            padding: 10px 14px;
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #38bdf8;
            color: #e0f2fe;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s ease;
            box-shadow: 0 4px 0 #0f172a, 0 5px 0 #38bdf8;
            font-family: inherit;
            text-align: left;
        }
        .map-modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #0f172a, 0 7px 0 #38bdf8;
        }
        .map-modal-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #0f172a, 0 2px 0 #38bdf8;
        }
        .map-modal-btn .pixel-grid {
            flex-shrink: 0;
            transform: scale(1.35);
            transform-origin: left center;
        }
        .map-modal-btn.baidumap { border-color: #3b82f6; color: #dbeafe; box-shadow: 0 4px 0 #0f172a, 0 5px 0 #3b82f6; }
        .map-modal-btn.baidumap:hover { box-shadow: 0 6px 0 #0f172a, 0 7px 0 #3b82f6; }
        .map-modal-btn.baidumap:active { box-shadow: 0 1px 0 #0f172a, 0 2px 0 #3b82f6; }
        .map-modal-btn.amap { border-color: #22c55e; color: #dcfce7; box-shadow: 0 4px 0 #0f172a, 0 5px 0 #22c55e; }
        .map-modal-btn.amap:hover { box-shadow: 0 6px 0 #0f172a, 0 7px 0 #22c55e; }
        .map-modal-btn.amap:active { box-shadow: 0 1px 0 #0f172a, 0 2px 0 #22c55e; }
        .map-modal-btn.qqmap { border-color: #f59e0b; color: #fef3c7; box-shadow: 0 4px 0 #0f172a, 0 5px 0 #f59e0b; }
        .map-modal-btn.qqmap:hover { box-shadow: 0 6px 0 #0f172a, 0 7px 0 #f59e0b; }
        .map-modal-btn.qqmap:active { box-shadow: 0 1px 0 #0f172a, 0 2px 0 #f59e0b; }
        .map-modal-close {
            margin-top: 12px;
            padding: 8px 16px;
            background: transparent;
            border: 2px solid #64748b;
            color: #94a3b8;
            font-size: 0.8rem;
            cursor: pointer;
            font-family: inherit;
        }
        .map-modal-close:hover {
            border-color: #94a3b8;
            color: #e2e8f0;
        }
    </style>
</head>

            CHAR_HAIR:           { color: 0x3f2e22, roughness: 0.90, metalness: 0.02, name: "角色头发" },
            CHAR_EYE_WHITE:      { color: 0xffffff, roughness: 0.20, metalness: 0.10, name: "角色眼白" },
            CHAR_EYE_PUPIL:      { color: 0x0f172a, roughness: 0.10, metalness: 0.20, name: "角色瞳孔" }
        };

        const container = document.getElementById('canvas-box');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 3000);
        camera.position.set(58, 42, 68);

        // 移动端检测：触屏、粗指针或常见移动 UA
        const isMobile = (('ontouchstart' in window) || (navigator.maxTouchPoints > 0) ||
            window.matchMedia('(pointer: coarse)').matches ||
            /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent));

        const renderer = new THREE.WebGLRenderer({
            antialias: !isMobile,
            logarithmicDepthBuffer: false
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(isMobile ? Math.min(window.devicePixelRatio, 1.5) : Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 8, 0);

        // 帧率限制与节流控制
        const TARGET_FPS = isMobile ? 30 : 60;
        const FRAME_INTERVAL = 1000 / TARGET_FPS;
        let lastFrameTime = 0;
        let lastSkyUpdateTime = 0;
        let lastRaycastTime = 0;
        let pendingPointerEvent = null;
        let isPageVisible = true;

        // 可复用临时向量，避免每帧 new THREE.Vector3
        const _v3A = new THREE.Vector3();
        const _v3B = new THREE.Vector3();
        const _v3C = new THREE.Vector3();
        const _v3Up = new THREE.Vector3(0, 1, 0);
        const _screenPos = new THREE.Vector3();
        const _colorA = new THREE.Color();
        const _colorB = new THREE.Color();
        const _colorC = new THREE.Color();

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffaee, 1.4);
        sunLight.castShadow = true;
        // 移动端降低阴影贴图分辨率并收紧视锥，减少每帧阴影开销
        const shadowMapSize = isMobile ? 1024 : 2048;
        sunLight.shadow.mapSize.width = shadowMapSize;
        sunLight.shadow.mapSize.height = shadowMapSize;
        sunLight.shadow.camera.left = -40;
        sunLight.shadow.camera.right = 40;
        sunLight.shadow.camera.top = 40;
        sunLight.shadow.camera.bottom = -40;
        sunLight.shadow.camera.near = 10;
        sunLight.shadow.camera.far = 300;
        scene.add(sunLight);

        const hemiLight = new THREE.HemisphereLight(0xbdd6e6, 0x3f6212, 0.35);
        scene.add(hemiLight);

        const matInstances = {};
        Object.keys(PALETTE).forEach(k => {
            matInstances[k] = new THREE.MeshStandardMaterial({
                color: PALETTE[k].color,
                roughness: PALETTE[k].roughness,
                metalness: PALETTE[k].metalness,
                transparent: PALETTE[k].transparent || false,
                opacity: PALETTE[k].opacity !== undefined ? PALETTE[k].opacity : 1.0,
                polygonOffset: (k === 'PET_EYE_SHINE'),
                polygonOffsetFactor: -1,
                polygonOffsetUnits: -1
            });
        });

        // 1. 场景构建
        const sceneVoxelMap = new Map();
        function setSceneV(x, y, z, type) { sceneVoxelMap.set(`${x},${y},${z}`, { x, y, z, type }); }

        const CHUNKY_FONTS = {
            'Y': ["11...11", "11...11", ".11.11.", "..111..", "..111..", "..111.."],
            'U': ["11...11", "11...11", "11...11", "11...11", "11...11", ".11111."],
            'A': [".11111.", "11...11", "11...11", "1111111", "11...11", "11...11"],
            'N': ["11...11", "111..11", "1111.11", "11.1111", "11..111", "11...11"],
            'E': ["1111111", "11.....", "111111.", "111111.", "11.....", "1111111"],
            'H': ["11...11", "11...11", "1111111", "1111111", "11...11", "11...11"],
            'O': [".11111.", "11...11", "11...11", "11...11", "11...11", ".11111."],
            'M': ["11...11", "111.111", "1111111", "11.1.11", "11...11", "11...11"],
            'S': [".111111", "11.....", ".11111.", ".....11", ".....11", "111111."],
            'T': ["1111111", "1111111", "...11..", "...11..", "...11..", "...11.."],
            ' ': [".......", ".......", ".......", ".......", ".......", "......."]
        };

        function addVoxelText(text, startX, startY, startZ, materialType, letterSpacing = 2, depth = 4) {
            let curX = startX;
            for (let char of text) {
                const matrix = CHUNKY_FONTS[char] || CHUNKY_FONTS[' '];
                const charW = matrix[0].length;
                for (let row = 0; row < 6; row++) {
                    for (let col = 0; col < charW; col++) {
                        if (matrix[row][col] === '1') {
                            const vx = curX + col;
                            const vy = startY + (5 - row);
                            for (let d = 0; d < depth; d++) setSceneV(vx, vy, startZ - d, materialType);
                        }
                    }
                }
                curX += (char === ' ') ? 4 : (charW + letterSpacing);
            }
        }

        const flowerVoxelList = [];
        function addMicroVoxel(wx, wy, wz, type) { flowerVoxelList.push({ x: wx, y: wy, z: wz, type }); }

        function buildPlumbagoBush(rootX, rootY, rootZ) {
            for (let dy = 0; dy <= 4; dy++) addMicroVoxel(rootX, rootY + dy * FLOWER_VOXEL_SIZE, rootZ, 'FLOWER_STEM');
            addMicroVoxel(rootX + FLOWER_VOXEL_SIZE, rootY + 2 * FLOWER_VOXEL_SIZE, rootZ, 'FLOWER_LEAF');
            addMicroVoxel(rootX - FLOWER_VOXEL_SIZE, rootY + 3 * FLOWER_VOXEL_SIZE, rootZ, 'FLOWER_LEAF');
            addMicroVoxel(rootX, rootY + 2 * FLOWER_VOXEL_SIZE, rootZ + FLOWER_VOXEL_SIZE, 'FLOWER_LEAF');

            const branches = [
                { ox: 0, oy: 4, oz: 0 }, { ox: 1.5, oy: 3.5, oz: 1 }, { ox: -1.5, oy: 3.5, oz: -1 },
                { ox: -1, oy: 4.2, oz: 1.5 }, { ox: 1.2, oy: 3.8, oz: -1.2 }
            ];

            branches.forEach(b => {
                const bx = rootX + b.ox * FLOWER_VOXEL_SIZE;
                const by = rootY + b.oy * FLOWER_VOXEL_SIZE;
                const bz = rootZ + b.oz * FLOWER_VOXEL_SIZE;
                addMicroVoxel(bx, by, bz, 'FLOWER_LEAF');
                addMicroVoxel(bx, by + FLOWER_VOXEL_SIZE, bz, 'PLUMBAGO_BLUE');
                addMicroVoxel(bx + FLOWER_VOXEL_SIZE, by + FLOWER_VOXEL_SIZE, bz, 'PLUMBAGO_BLUE');
                addMicroVoxel(bx, by + FLOWER_VOXEL_SIZE, bz + FLOWER_VOXEL_SIZE, 'PLUMBAGO_BLUE');
                addMicroVoxel(bx, by + 2 * FLOWER_VOXEL_SIZE, bz, 'PLUMBAGO_BLUE');
            });
        }

        function buildHydrangeaBush(rootX, rootY, rootZ, flowerType) {
            for (let dy = 0; dy <= 3; dy++) addMicroVoxel(rootX, rootY + dy * FLOWER_VOXEL_SIZE, rootZ, 'FLOWER_STEM');
            const leafOffsets = [
                [2, 2, 0], [3, 1.5, 0], [-2, 2, 0], [-3, 1.5, 0],
                [0, 2, 2], [0, 1.5, 3], [0, 2, -2], [0, 1.5, -3],
                [1.5, 2, 1.5], [-1.5, 2, -1.5], [1.5, 2, -1.5], [-1.5, 2, 1.5]
            ];
            leafOffsets.forEach(pos => {
                addMicroVoxel(rootX + pos[0] * FLOWER_VOXEL_SIZE, rootY + pos[1] * FLOWER_VOXEL_SIZE, rootZ + pos[2] * FLOWER_VOXEL_SIZE, 'FLOWER_LEAF');
            });

            const headCenterY = rootY + 5 * FLOWER_VOXEL_SIZE;
            for (let dx = -2; dx <= 2; dx++) {
                for (let dz = -2; dz <= 2; dz++) {
                    for (let dy = -1; dy <= 2; dy++) {
                        if (dx * dx + dz * dz + dy * dy <= 5.5) {
                            addMicroVoxel(rootX + dx * FLOWER_VOXEL_SIZE, headCenterY + dy * FLOWER_VOXEL_SIZE, rootZ + dz * FLOWER_VOXEL_SIZE, flowerType);
                        }
                    }
                }
            }
        }

        function buildHomestayAndHills() {
            for (let x = -70; x <= 65; x++) {
                for (let z = -60; z <= 45; z++) {
                    if (z <= -15) continue;
                    if (x >= -32 && x <= 22 && z >= -5 && z <= 18) {
                        setSceneV(x, 0, z, 'TERRACE_LAWN');
                    } else if (x > 22 && x <= 34 && z >= -3 && z <= 16) {
                        setSceneV(x, 0, z, 'GROUND_PATIO');
                    } else if (z > 18) {
                        const t = (z - 18) / 27.0;
                        const pathCenterX = 26.5 + t * 24.0 + Math.sin(t * Math.PI) * 4.0;
                        const distToPath = Math.abs(x - pathCenterX);
                        if (distToPath <= 4.0) {
                            const isBorder = (distToPath >= 3.2);
                            const stoneType = isBorder ? 'COBBLE_BORDER' : (((x + z) % 3 === 0) ? 'COBBLE_DARK' : 'COBBLE_LIGHT');
                            setSceneV(x, -2, z, stoneType);
                        } else {
                            const lawnPattern = ((x + z) % 3 === 0) ? 'TEA_LIGHT' : 'TERRACE_LAWN';
                            setSceneV(x, -2, z, lawnPattern);
                        }
                    } else {
                        setSceneV(x, -1, z, 'TEA_LIGHT');
                    }
                }
            }

            for (let z = 19; z <= 44; z += 2.2) {
                const t = (z - 18) / 27.0;
                const pathCenterX = 26.5 + t * 24.0 + Math.sin(t * Math.PI) * 4.0;
                const groundWorldY = -2 * SCENE_VOXEL_SIZE + 0.5 * SCENE_VOXEL_SIZE;

                const leftWorldX = (pathCenterX - 4.4) * SCENE_VOXEL_SIZE + (Math.sin(z * 2.5) * 0.2);
                const leftWorldZ = z * SCENE_VOXEL_SIZE;
                const leftMod = Math.floor(z) % 3;
                if (leftMod === 0) buildPlumbagoBush(leftWorldX, groundWorldY, leftWorldZ);
                else if (leftMod === 1) buildHydrangeaBush(leftWorldX, groundWorldY, leftWorldZ, 'HYDRANGEA_PURPLE');
                else buildHydrangeaBush(leftWorldX, groundWorldY, leftWorldZ, 'HYDRANGEA_WHITE');

                const rightWorldX = (pathCenterX + 4.4) * SCENE_VOXEL_SIZE + (Math.cos(z * 2.5) * 0.2);
                const rightWorldZ = (z + 1.1) * SCENE_VOXEL_SIZE;
                const rightMod = (Math.floor(z) + 1) % 3;
                if (rightMod === 0) buildHydrangeaBush(rightWorldX, groundWorldY, rightWorldZ, 'HYDRANGEA_WHITE');
                else if (rightMod === 1) buildPlumbagoBush(rightWorldX, groundWorldY, rightWorldZ);
                else buildHydrangeaBush(rightWorldX, groundWorldY, rightWorldZ, 'HYDRANGEA_PURPLE');
            }

            for (let x = -34; x <= 24; x++) { setSceneV(x, 0, 18, 'STONE_WALL'); setSceneV(x, -1, 18, 'STONE_WALL'); }
            for (let z = -5; z <= 18; z++) { setSceneV(-34, 0, z, 'STONE_WALL'); setSceneV(-34, -1, z, 'STONE_WALL'); }

            for (let x = 24; x <= 29; x++) {
                setSceneV(x, -1, 17, 'COBBLE_LIGHT'); setSceneV(x, 0, 17, 'COBBLE_LIGHT');
                setSceneV(x, -1, 18, 'COBBLE_DARK'); setSceneV(x, 0, 18, 'COBBLE_LIGHT');
            }

            const hillCenter1 = { x: -45, z: -35 };
            for (let y = 1; y <= 24; y += 2) {
                const radius = Math.max(2, 38 - y * 1.4);
                for (let dx = -radius; dx <= radius; dx++) {
                    for (let dz = -radius; dz <= radius; dz++) {
                        if (dx * dx + dz * dz <= radius * radius) {
                            const vx = Math.round(hillCenter1.x + dx);
                            const vz = Math.round(hillCenter1.z + dz);
                            const mat = (y % 4 === 1) ? 'TEA_DARK' : 'TEA_LIGHT';
                            setSceneV(vx, y, vz, mat); setSceneV(vx, y + 1, vz, mat);
                        }
                    }
                }
            }

            for (let x = -20; x <= 65; x += 2) {
                for (let z = -55; z <= -12; z += 2) {
                    const baseHeight = Math.floor(Math.sin(x * 0.08) * 4 + Math.cos(z * 0.08) * 5 + (-z - 10) * 0.45);
                    const stepY = Math.max(1, Math.min(26, Math.floor(baseHeight / 2) * 2));
                    for (let y = 1; y <= stepY; y += 2) {
                        for (let ox = 0; ox <= 1; ox++) {
                            for (let oz = 0; oz <= 1; oz++) {
                                const isEdge = (y === stepY);
                                setSceneV(x + ox, y, z + oz, isEdge ? 'TEA_RIDGE' : ((y % 4 === 1) ? 'TEA_DARK' : 'TEA_LIGHT'));
                                setSceneV(x + ox, y + 1, z + oz, isEdge ? 'TEA_RIDGE' : 'TEA_DARK');
                            }
                        }
                    }
                }
            }

            addVoxelText("YUANYE",   -26, 36, -36, 'SIGN_YELLOW', 2, 4);
            addVoxelText("HOMESTAY", -35, 28, -36, 'SIGN_GREEN',  2, 4);

            function addPine(rootX, rootY, rootZ, height = 14) {
                for (let y = 1; y <= 4; y++) setSceneV(rootX, rootY + y, rootZ, 'TREE_TRUNK');
                for (let y = rootY + 3; y <= rootY + height; y++) {
                    const r = Math.max(0, Math.round((1 - (y - (rootY + 3)) / (height - 3)) * 3.2));
                    const leaf = (y % 2 === 0) ? 'PINE_LEAF_D' : 'PINE_LEAF_L';
                    for (let dx = -r; dx <= r; dx++) {
                        for (let dz = -r; dz <= r; dz++) {
                            if (dx * dx + dz * dz <= r * r + 0.5) setSceneV(rootX + dx, y, rootZ + dz, leaf);
                        }
                    }
                }
                setSceneV(rootX, rootY + height + 1, rootZ, 'PINE_LEAF_L');
            }

            function addRoundTree(rootX, rootY, rootZ, radius = 3) {
                for (let y = 1; y <= 3; y++) setSceneV(rootX, rootY + y, rootZ, 'TREE_TRUNK');
                for (let dy = -radius; dy <= radius; dy++) {
                    for (let dx = -radius; dx <= radius; dx++) {
                        for (let dz = -radius; dz <= radius; dz++) {
                            if (dx * dx + dy * dy + dz * dz <= radius * radius + 0.8) {
                                setSceneV(rootX + dx, rootY + 3 + radius + dy, rootZ + dz, (dy >= 1) ? 'ROUND_TREE_L' : 'ROUND_TREE_D');
                            }
                        }
                    }
                }
            }

            const pineList = [
                { x: -28, z: -16, h: 14 }, { x: -22, z: -18, h: 15 }, { x: -16, z: -20, h: 16 },
                { x: -10, z: -22, h: 16 }, { x: -4,  z: -24, h: 17 }, { x: 2,   z: -24, h: 17 },
                { x: 8,   z: -22, h: 16 }, { x: 14,  z: -20, h: 15 }, { x: 20,  z: -18, h: 14 },
                { x: -35, z: -28, h: 16 }, { x: -38, z: -22, h: 15 }, { x: 26,  z: -26, h: 16 },
                { x: 32,  z: -22, h: 15 }, { x: 38,  z: -18, h: 14 }, { x: -45, z: -35, h: 18 }
            ];
            pineList.forEach(p => {
                let gy = 0;
                for (let y = 30; y >= 0; y--) { if (sceneVoxelMap.has(`${p.x},${y},${p.z}`)) { gy = y; break; } }
                addPine(p.x, gy, p.z, p.h);
            });

            addRoundTree(-28, 0, 8, 3);
            addRoundTree(-32, 0, 14, 4);
            addRoundTree(34, 0, 8, 3);

            for (let y = 1; y <= 16; y++) {
                for (let x = -26; x <= -13; x++) {
                    for (let z = -10; z <= 7; z++) {
                        const isBorder = (x === -26 || x === -13 || z === -10 || z === 7);
                        if (y === 14) { setSceneV(x, y, z, 'ROOF_TERRACE'); continue; }
                        if (y >= 15) { if (isBorder) setSceneV(x, y, z, 'WALL'); continue; }
                        if (!isBorder && y < 14) continue;
                        let type = 'WALL';
                        if (z === 7 && y >= 3 && y <= 7) {
                            if (x === -24 || x === -22 || x === -20 || x === -18 || x === -16 || x === -14) type = 'WINDOW_BLUE';
                        }
                        if (z === 7) {
                            if (x >= -25 && x <= -21 && y >= 9 && y <= 12) type = (x >= -24 && x <= -22 && y >= 10 && y <= 11) ? 'WINDOW_DARK' : 'WALL_FRAME';
                            if (x >= -18 && x <= -14 && y >= 9 && y <= 12) type = (x >= -17 && x <= -15 && y >= 10 && y <= 11) ? 'WINDOW_DARK' : 'WALL_FRAME';
                        }
                        if (x === -26) {
                            if (z >= 2 && z <= 4 && y >= 1 && y <= 6) type = (z === 2 || z === 4 || y === 6) ? 'DOOR_FRAME' : 'DOOR_SIDE';
                            else if ((z === 3 || z === 4) && (y === 10 || y === 11)) type = 'WINDOW_DARK';
                        }
                        setSceneV(x, y, z, type);
                    }
                }
            }
            setSceneV(-27, 0, 3, 'DOOR_STEP');
            for (let y = 1; y <= 20; y++) setSceneV(-12, y, 7, 'PIPE');

            for (let y = 1; y <= 20; y++) {
                for (let x = -11; x <= 16; x++) {
                    for (let z = -10; z <= 7; z++) {
                        const isDoorVoid = (x >= -2 && x <= 2 && z >= 5 && y <= 7);
                        const isBalconyVoid = (x >= -4 && x <= 3 && z >= 5 && (y >= 8 && y <= 13 || y >= 14 && y <= 18));
                        if (isDoorVoid || isBalconyVoid) continue;
                        const isBorder = (x === -11 || x === 16 || z === -10 || z === 7);
                        if (!isBorder && y < 20) continue;
                        let type = 'WALL';
                        if (z === 7) {
                            if ((x === -10 || x === -8 || x === -6) && y >= 3 && y <= 7) type = 'WINDOW_BLUE';
                            if (x >= -10 && x <= -6 && y >= 10 && y <= 13) type = (x >= -9 && x <= -7 && (y === 11 || y === 12)) ? 'WINDOW_DARK' : 'WALL_FRAME';
                            if (x >= -10 && x <= -6 && y >= 15 && y <= 18) type = (x >= -9 && x <= -7 && (y === 16 || y === 17)) ? 'WINDOW_DARK' : 'WALL_FRAME';
                            if (x >= 5 && x <= 15) {
                                if (y >= 2 && y <= 6) type = 'WINDOW_DARK';
                                if (y >= 10 && y <= 12) type = 'WINDOW_DARK';
                                if (y >= 15 && y <= 17) type = 'WINDOW_DARK';
                            }
                        }
                        if (x === 16) {
                            if (z >= 2 && z <= 6 && y >= 2 && y <= 6) type = 'WINDOW_DARK';
                            if ((z === -2 || z === -5 || z === -8) && y >= 3 && y <= 6) type = 'WINDOW_DARK';
                            if ((z === 3 || z === 4) && (y === 11 || y === 12)) type = 'WINDOW_DARK';
                        }
                        setSceneV(x, y, z, type);
                    }
                }
            }

            for (let y = 1; y <= 7; y++) {
                for (let x = -2; x <= 2; x++) {
                    setSceneV(x, y, 4, 'WALL');
                    if (y === 1) { setSceneV(x, 0, 8, 'DOOR_STEP'); setSceneV(x, 1, 6, 'BALCONY_FLOOR'); }
                    if (x === -2 || x === 2 || y === 7) setSceneV(x, y, 7, 'DOOR_FRAME');
                    else {
                        if (x === -1 || x === 0) setSceneV(x, y, 7, 'DOOR_WOOD_L');
                        if (x === 1) setSceneV(x, y, 7, 'DOOR_WOOD_R');
                    }
                }
            }

            function buildBalcony(baseY, isTopFloor) {
                for (let x = -4; x <= 3; x++) {
                    for (let z = 5; z <= 8; z++) setSceneV(x, baseY, z, (z === 8 || x === -4 || x === 3) ? 'BALCONY_BEAM' : 'BALCONY_FLOOR');
                }
                for (let y = baseY + 1; y <= baseY + 4; y++) {
                    for (let x = -3; x <= 2; x++) setSceneV(x, y, 4, 'WINDOW_DARK');
                    setSceneV(-4, y, 4, 'WALL'); setSceneV(3, y, 4, 'WALL');
                }
                for (let y = baseY + 1; y <= baseY + 2; y++) {
                    for (let x = -4; x <= 3; x++) {
                        if (Math.abs(x) % 2 === 0 || x === -4 || x === 3) setSceneV(x, y, 8, 'RAILING_BAR');
                    }
                    setSceneV(-4, y, 6, 'RAILING_BAR'); setSceneV(-4, y, 7, 'RAILING_BAR');
                    setSceneV(3, y, 6, 'RAILING_BAR');  setSceneV(3, y, 7, 'RAILING_BAR');
                }
                for (let x = -4; x <= 3; x++) setSceneV(x, baseY + 3, 8, 'RAILING_TOP');
                for (let z = 5; z <= 8; z++) { setSceneV(-4, baseY + 3, z, 'RAILING_TOP'); setSceneV(3, baseY + 3, z, 'RAILING_TOP'); }
                if (isTopFloor) {
                    for (let x = -4; x <= 3; x++) {
                        for (let z = 4; z <= 7; z++) { setSceneV(x, 19, z, 'WALL'); setSceneV(x, 20, z, 'WALL'); }
                    }
                }
            }
            buildBalcony(7, false);
            buildBalcony(13, true);

            for (let step = 0; step <= 5; step++) {
                const y = 21 + step;
                const zFront = 8 - step;
                const zBack = -11 + step;
                for (let x = -12; x <= 17; x++) {
                    const isRoofCutout = (x >= -4 && x <= 3 && zFront >= 5 && step <= 2);
                    for (let z = zBack; z <= zFront; z++) {
                        if (z === zFront || z === zBack || step === 5) {
                            if (isRoofCutout && z === zFront) {
                                if (step === 1 && (x === -2 || x === 1)) setSceneV(x, y, z - 1, 'WINDOW_DARK');
                                else setSceneV(x, y, z - 1, 'WALL');
                                continue;
                            }
                            setSceneV(x, y, z, 'ROOF_RED');
                        } else {
                            if (x === -12 || x === 17) setSceneV(x, y, z, 'WALL');
                        }
                    }
                }
            }

            for (let cy = 23; cy <= 25; cy++) { setSceneV(-4, cy, -5, 'CHIMNEY'); setSceneV(-3, cy, -5, 'CHIMNEY'); }
            for (let cy = 23; cy <= 26; cy++) { setSceneV(-1, cy, -7, 'CHIMNEY'); setSceneV(0, cy, -7, 'CHIMNEY'); }
            setSceneV(1, 25, -5, 'CHIMNEY');

            for (let x = 18; x <= 26; x++) {
                for (let z = -5; z <= 11; z++) {
                    if ((x === 18 || x === 26) && (z === -5 || z === 11)) {

            return {
                points: waypoints, currentIndex: 0, targetIndex: 1, root: rootObj, speed: baseSpeed, state: 'WALKING', idleTimer: 0,
                update(delta) {
                    const currentPt = this.points[this.currentIndex];
                    const targetPt = this.points[this.targetIndex];
                    if (this.state === 'IDLE') {
                        this.idleTimer -= delta;
                        if (this.idleTimer <= 0) {
                            this.state = 'WALKING';
                            this.currentIndex = this.targetIndex;
                            this.targetIndex = (this.targetIndex + 1) % this.points.length;
                        }
                        return false;

                    const dx = targetPt.x - this.root.position.x;
                    const dz = targetPt.z - this.root.position.z;
                    const dist = Math.sqrt(dx * dx + dz * dz);
                    if (dist < 0.2) {
                        this.root.position.x = targetPt.x;
                        this.root.position.z = targetPt.z;
                        this.state = 'IDLE';
                        this.idleTimer = targetPt.pause || 2.0;
                        return false;
                    }
                    const targetAngle = Math.atan2(dx, dz);
                    let angleDiff = targetAngle - this.root.rotation.y;
                    while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                    while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                    this.root.rotation.y += angleDiff * 0.1;

                    const step = Math.min(dist, this.speed * delta);

                    this.root.position.z += (dz / dist) * step;
                    this.root.position.y = EXACT_GROUND_Y + (this.root.userData.jumpOffset || 0);

                    setCK(bodyMap, 1, 6 + t, -bLen + 2 - t, mainFeather);
                }
            }

                for (let ly = 0; ly <= 2; ly++) setCK(bodyMap, lx, ly, -1, 'CHICKEN_LEG');
                setCK(bodyMap, lx, 0, 0, 'CHICKEN_LEG');

            for (let hy = 0; hy <= 3; hy++) {
                for (let hz = 1; hz <= 3; hz++) {
                    for (let hx = -1; hx <= 1; hx++) {

                        instMesh.setMatrixAt(i, dummy.matrix);

                    instMesh.instanceMatrix.needsUpdate = true;
                    parentNode.add(instMesh);

            createChickenMeshBucket(bodyMap, group);
            createChickenMeshBucket(headMap, headGroup);
            group.add(headGroup);

            group.userData = { headGroup, peckTimer: Math.random() * 3, isPecking: false, isPet: true, petKey: 'CHICKEN', chickenName: name };
            return group;
        }

        const LAWN_BOX = { minX: -11.0, maxX: 8.5, minZ: 4.8, maxZ: 7.8 };

        function isPositionBlocked(x, z) {
            return (x < LAWN_BOX.minX || x > LAWN_BOX.maxX || z < LAWN_BOX.minZ || z > LAWN_BOX.maxZ);
        }

        function getSafeLawnTarget(currentX, currentZ) {
            let tx, tz;

            let attempts = 0;
            while (!valid && attempts < 60) {
                attempts++;
                tx = LAWN_BOX.minX + Math.random() * (LAWN_BOX.maxX - LAWN_BOX.minX);
                tz = LAWN_BOX.minZ + Math.random() * (LAWN_BOX.maxZ - LAWN_BOX.minZ);
                const dist = Math.sqrt((tx - currentX) ** 2 + (tz - currentZ) ** 2);
                if (dist > 3.0) valid = true;

            return { x: tx, z: tz, pause: 1.5 + Math.random() * 2.5 };

                const lookAheadDist = 0.8;
                const forwardX = this.root.position.x + (dx / (dist || 1)) * lookAheadDist;
                const forwardZ = this.root.position.z + (dz / (dist || 1)) * lookAheadDist;

                if (isPositionBlocked(forwardX, forwardZ)) {
                    this.target = getSafeLawnTarget(this.root.position.x, this.root.position.z);
                    dx = this.target.x - this.root.position.x;
                    dz = this.target.z - this.root.position.z;
                    dist = Math.sqrt(dx * dx + dz * dz);
                }

                if (dist < 0.25) {
                    this.root.position.x = this.target.x;
                    this.root.position.z = this.target.z;
                    this.state = 'IDLE';
                    this.idleTimer = this.target.pause;
                    return false;
                }

                const targetAngle = Math.atan2(dx, dz);
                let angleDiff = targetAngle - this.root.rotation.y;
                while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                this.root.rotation.y += angleDiff * 0.12;

                const step = Math.min(dist, this.speed * delta);
                this.root.position.x += (dx / dist) * step;
                this.root.position.z += (dz / dist) * step;
                this.root.position.y = EXACT_GROUND_Y;
                return true;
            }

        leaderMesh.position.set(initialChickenX, EXACT_GROUND_Y, initialChickenZ);

        const followerConfigs = [

        // 玩家角色系统 (来自 character_preview.html)

        {

            const voxelBoxGeo = new THREE.BoxGeometry(VOXEL_SIZE, VOXEL_SIZE, VOXEL_SIZE);

            function createVoxelGroup(voxelMap, parentNode) {
                const buckets = {};
                voxelMap.forEach(v => {
                    if (!buckets[v.type]) buckets[v.type] = [];
                    buckets[v.type].push(v);
                });

                Object.keys(buckets).forEach(type => {
                    const list = buckets[type];
                    const instMesh = new THREE.InstancedMesh(voxelBoxGeo, matInstances[type], list.length);
                    instMesh.castShadow = true;
                    instMesh.receiveShadow = true;
                    instMesh.userData = { isPet: true, petKey: 'CHARACTER' };

                    for (let i = 0; i < list.length; i++) {
                        const v = list[i];
                        dummy.position.set(v.x * VOXEL_SIZE, v.y * VOXEL_SIZE, v.z * VOXEL_SIZE);
                        dummy.updateMatrix();
                        instMesh.setMatrixAt(i, dummy.matrix);
                    }
                    instMesh.instanceMatrix.needsUpdate = true;
                    parentNode.add(instMesh);
                });
            }

            // ==================== 1. 头部与面部 ====================
            const headMap = new Map();
            function setHeadV(x, y, z, type) { headMap.set(`${x},${y},${z}`, { x, y, z, type }); }

            for (let y = 0; y <= 8; y++) {

            }
            setHeadV(-3, 8, 4, 'HAIR'); setHeadV(-2, 8, 4, 'HAIR'); setHeadV(-1, 8, 4, 'HAIR');
            setHeadV(1, 8, 4, 'HAIR'); setHeadV(2, 8, 4, 'HAIR'); setHeadV(3, 8, 4, 'HAIR');
            setHeadV(-2, 7, 4, 'HAIR'); setHeadV(2, 7, 4, 'HAIR'); setHeadV(0, 8, 4, 'HAIR');

            // 大眼睛与神采高光

                setHeadV(eyeCenterX, 5, 4, 'EYE_PUPIL');
                setHeadV(eyeCenterX + 1, 5, 4, 'EYE_WHITE');
                setHeadV(eyeCenterX - 1, 4, 4, 'EYE_WHITE');

            forearmMap.set(`0,-5,2`, { x: 0, y: -5, z: 2, type: 'SKIN' }); // 拇指

            // 大腿 (髋到膝)

            // ==================== 骨骼层级架构组装 (双段关节) ====================

            upperArmRGroup.position.set(6.5 * VOXEL_SIZE, -1 * VOXEL_SIZE, 0);
            bodyGroup.add(upperArmRGroup);

            // 腿部装配：大腿 -> 小腿
            calfLGroup.position.set(0, -7 * VOXEL_SIZE, 0);
            thighLGroup.add(calfLGroup);
            thighLGroup.position.set(-2.4 * VOXEL_SIZE, -12 * VOXEL_SIZE, 0);
            bodyGroup.add(thighLGroup);

            calfRGroup.position.set(0, -7 * VOXEL_SIZE, 0);
            thighRGroup.add(calfRGroup);
            thighRGroup.position.set(2.4 * VOXEL_SIZE, -12 * VOXEL_SIZE, 0);
            bodyGroup.add(thighRGroup);

            bodyGroup.position.set(0, 28 * VOXEL_SIZE, 0);
            characterRoot.add(bodyGroup);
            scene.add(characterRoot);

            characterRoot.userData = { name: "角色", key: 'CHARACTER', isJumping: false };

            characterRoot.scale.set(0.6, 0.6, 0.6);
            // 民宿大门位于 z≈7、x≈-1~1，角色站在大门右侧旁边，正对观众
            characterRoot.position.set(4.5, EXACT_GROUND_Y, 8.5);
            characterRoot.rotation.y = 0;

            // ==================== 高级自然动力学步态计算 ====================
            let currentAnimState = 'IDLE';
            let jumpProgress = 0;
            let isJumping = false;
            let waveTimer = 0;

            triggerCharacterJump = function() {
                if (isJumping) return;
                isJumping = true;
                jumpProgress = 0;
                characterRoot.userData.isJumping = true;
            };

            triggerCharacterWave = function() {
                waveTimer = 1.5;
            };

            updateCharacterAnimation = function(elapsed, delta, isMoving) {
                if (waveTimer > 0) {
                    waveTimer -= delta;
                    if (waveTimer < 0) waveTimer = 0;
                }

                if (!isJumping) {
                    if (waveTimer > 0) {
                        currentAnimState = 'WAVE';
                    } else if (isMoving) {
                        currentAnimState = 'WALK';
                    } else {
                        currentAnimState = 'IDLE';
                    }
                }

                if (currentAnimState === 'IDLE') {
                    const breath = Math.sin(elapsed * 2.5);
                    bodyGroup.position.y = (28 + breath * 0.25) * VOXEL_SIZE;
                    bodyGroup.rotation.x = 0;
                    bodyGroup.rotation.y = 0;
                    bodyGroup.rotation.z = 0;

                    headGroup.rotation.x = breath * 0.03;
                    headGroup.rotation.y = Math.sin(elapsed * 0.8) * 0.06;

                    upperArmLGroup.rotation.set(0, 0, -0.22 + breath * 0.02);
                    forearmLGroup.rotation.set(-0.15, 0, 0);
                    upperArmRGroup.rotation.set(0, 0, 0.22 - breath * 0.02);
                    forearmRGroup.rotation.set(-0.15, 0, 0);

                    thighLGroup.rotation.set(0, 0, 0);
                    calfLGroup.rotation.set(0, 0, 0);
                    thighRGroup.rotation.set(0, 0, 0);
                    calfRGroup.rotation.set(0, 0, 0);

                } else if (currentAnimState === 'WAVE') {
                    const breath = Math.sin(elapsed * 2.5);
                    const waveSpeed = 8.0;
                    const wave = Math.sin(elapsed * waveSpeed);

                    bodyGroup.position.y = (28 + breath * 0.2) * VOXEL_SIZE;
                    bodyGroup.rotation.set(0, 0, -0.04 + breath * 0.015);

                    headGroup.rotation.x = breath * 0.03;
                    headGroup.rotation.y = -0.18 + Math.sin(elapsed * waveSpeed * 0.5) * 0.05;

                    upperArmLGroup.rotation.set(0, 0, -0.18 + breath * 0.02);
                    forearmLGroup.rotation.set(-0.12, 0, 0);

                    upperArmRGroup.rotation.set(-2.25, 0, 0.55 + breath * 0.02);
                    forearmRGroup.rotation.set(-0.45 + wave * 0.35, 0, 0);

                    thighLGroup.rotation.set(0, 0, 0);
                    calfLGroup.rotation.set(0, 0, 0);
                    thighRGroup.rotation.set(0, 0, 0);
                    calfRGroup.rotation.set(0, 0, 0);

                } else {
                    const isRun = (currentAnimState === 'RUN');
                    const speed = isRun ? 13.5 : 7.2;
                    const t = elapsed * speed;

                    bodyGroup.rotation.x = isRun ? 0.22 : 0.06;
                    bodyGroup.rotation.y = Math.sin(t) * (isRun ? 0.08 : 0.04);
                    bodyGroup.rotation.z = Math.cos(t) * (isRun ? 0.05 : 0.025);
                    headGroup.rotation.y = -bodyGroup.rotation.y * 0.8;

                    const bounce = Math.abs(Math.sin(t)) * (isRun ? 1.1 : 0.4);
                    bodyGroup.position.y = (28 + bounce) * VOXEL_SIZE;

                    const legSwingAmp = isRun ? 0.95 : 0.55;
                    const swingL = Math.sin(t);
                    const swingR = -swingL;

                    thighLGroup.rotation.x = swingL * legSwingAmp;
                    thighRGroup.rotation.x = swingR * legSwingAmp;

                    const kneeBendL = isRun
                        ? Math.max(0, -Math.sin(t - 0.4) * 1.3)
                        : Math.max(0, -Math.sin(t - 0.3) * 0.7);
                    const kneeBendR = isRun
                        ? Math.max(0, -Math.sin(t + Math.PI - 0.4) * 1.3)
                        : Math.max(0, -Math.sin(t + Math.PI - 0.3) * 0.7);

                    calfLGroup.rotation.x = kneeBendL;
                    calfRGroup.rotation.x = kneeBendR;

                    const armSwingAmp = isRun ? 1.05 : 0.58;
                    upperArmLGroup.rotation.x = -swingL * armSwingAmp;
                    upperArmRGroup.rotation.x = -swingR * armSwingAmp;

                    upperArmLGroup.rotation.z = -0.18 - Math.abs(swingL) * 0.05;
                    upperArmRGroup.rotation.z = 0.18 + Math.abs(swingR) * 0.05;

                    const elbowBendL = isRun
                        ? -(0.45 + Math.max(0, -swingL) * 0.95)
                        : -(0.15 + Math.max(0, -swingL) * 0.55);
                    const elbowBendR = isRun
                        ? -(0.45 + Math.max(0, -swingR) * 0.95)
                        : -(0.15 + Math.max(0, -swingR) * 0.55);

                    forearmLGroup.rotation.x = elbowBendL;
                    forearmRGroup.rotation.x = elbowBendR;
                }

                if (isJumping) {
                    jumpProgress += delta * 3.2;
                    const jumpH = Math.sin(jumpProgress * Math.PI) * 1.6;
                    characterRoot.position.y = EXACT_GROUND_Y + Math.max(0, jumpH);

                    upperArmLGroup.rotation.x = -1.1;
                    upperArmRGroup.rotation.x = -1.1;
                    forearmLGroup.rotation.x = -0.6;
                    forearmRGroup.rotation.x = -0.6;

                    thighLGroup.rotation.x = -0.5;
                    thighRGroup.rotation.x = -0.3;
                    calfLGroup.rotation.x = 0.9;
                    calfRGroup.rotation.x = 0.7;

                        characterRoot.position.y = EXACT_GROUND_Y;
                    }
                } else {
                    characterRoot.position.y = EXACT_GROUND_Y;
                }
            };
        }

        function updateChickens(delta, elapsed) {
            const isLeaderMoving = leaderAI.update(delta);
            chickens.forEach((ck, index) => {
                const u = ck.mesh.userData;
                if (ck.isLeader) {
                    if (isLeaderMoving) {
                        u.headGroup.rotation.x = Math.sin(elapsed * 12) * 0.25;
                        u.headGroup.position.z = Math.cos(elapsed * 12) * 0.01;
                        ck.mesh.position.y = EXACT_GROUND_Y;
                    } else {
                        ck.mesh.position.y = EXACT_GROUND_Y;
                        handlePecking(ck, delta, u);
                    }
                } else {
                    const angle = leaderMesh.rotation.y;
                    const cos = Math.cos(angle);
                    const sin = Math.sin(angle);
                    
                    const rotatedOffsetX = ck.offset.x * cos - ck.offset.z * sin;
                    const rotatedOffsetZ = ck.offset.x * sin + ck.offset.z * cos;

                    let targetX = leaderMesh.position.x + rotatedOffsetX;
                    let targetZ = leaderMesh.position.z + rotatedOffsetZ;

                    targetX = Math.max(LAWN_BOX.minX, Math.min(LAWN_BOX.maxX, targetX));
                    targetZ = Math.max(LAWN_BOX.minZ, Math.min(LAWN_BOX.maxZ, targetZ));
                    
                    const dx = targetX - ck.mesh.position.x;
                    const dz = targetZ - ck.mesh.position.z;
                    const dist = Math.sqrt(dx * dx + dz * dz);

                    if (dist > 0.18) {
                        const targetAngle = Math.atan2(dx, dz);
                        let angleDiff = targetAngle - ck.mesh.rotation.y;
                        while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                        ck.mesh.rotation.y += angleDiff * 0.14;

                        const followSpeed = 1.1;
                        const step = Math.min(dist, followSpeed * delta);
                        ck.mesh.position.x += (dx / dist) * step;
                        ck.mesh.position.z += (dz / dist) * step;
                        ck.mesh.position.y = EXACT_GROUND_Y;

                        u.headGroup.rotation.x = Math.sin(elapsed * 11 + index) * 0.2;
                    } else {
                        ck.mesh.position.y = EXACT_GROUND_Y;
                        handlePecking(ck, delta, u);
                    }
                }
            });
        }

        function handlePecking(ck, delta, u) {
            u.peckTimer -= delta;
            if (u.peckTimer <= 0) {
                u.peckTimer = 1.8 + Math.random() * 2.5;
                u.isPecking = true;
                new TWEEN.Tween(u.headGroup.rotation)
                    .to({ x: 0.85 }, 120)
                    .yoyo(true).repeat(3)
                    .onComplete(() => {
                        u.headGroup.rotation.x = 0;

                    .start();
            }
        }

        // 3. 天体与天气系统

        ];
        coronaOffsets.forEach(pos => {
            const cMesh = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), sunCoronaMat);
            cMesh.position.set(...pos);

        const moonGroup = new THREE.Group();
        const moonMat = new THREE.MeshBasicMaterial({ color: 0xfffed6 });
        const moonPoints = [
            [-1.5, 3.5, 0], [-0.5, 3.5, 0], [-2.5, 2.5, 0], [-1.5, 2.5, 0], [-0.5, 2.5, 0],
            [-2.5, 1.5, 0], [-1.5, 1.5, 0], [-2.5, 0.5, 0], [-1.5, 0.5, 0],
            [-2.5, -0.5, 0], [-1.5, -0.5, 0], [-2.5, -1.5, 0], [-1.5, -1.5, 0],
            [-2.5, -2.5, 0], [-1.5, -2.5, 0], [-0.5, -2.5, 0], [-1.5, -3.5, 0], [-0.5, -3.5, 0]
        ];
        moonPoints.forEach(p => {

        const starShaderMat = new THREE.ShaderMaterial({

                attribute vec3 aColor;

                uniform float uTime;
                uniform float uGlobalOpacity;
                uniform float uTwinkleSpeed;
                varying vec3 vColor;
                varying float vAlpha;

                void main() {
                    vColor = aColor;
                    float twinkle = sin(uTime * aSpeed * uTwinkleSpeed + aPhase) * 0.45 + 0.55;
                    vAlpha = uGlobalOpacity * twinkle;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = (2.2 + twinkle * 1.8) * (800.0 / -mvPosition.z);

            fragmentShader: `

                    vec2 coord = gl_PointCoord - vec2(0.5);
                    if (abs(coord.x) > 0.45 || abs(coord.y) > 0.45) discard;

        // 声音引擎
        class HappyChiptuneAudioEngine {
            constructor() {
                this.ctx = null;
                this.isPlaying = false;
                this.timer = null;
                this.natureTimer = null;
                this.currentStep = 0;
                this.bpm = 92;
                this.masterGain = null;
                this.musicGain = null;
                this.fxGain = null;
                this.rainGain = null;
                this.rainSource = null;

                this.melodyNotes = [
                    523.25, 659.25, 783.99, 1046.50, 783.99, 659.25, 880.00, 1046.50,
                    587.33, 698.46, 880.00, 1174.66, 880.00, 698.46, 783.99, 987.77,
                    523.25, 659.25, 783.99, 1318.51, 1046.50, 783.99, 880.00, 1046.50,
                    987.77, 783.99, 880.00, 698.46,  783.99, 587.33, 523.25, 0
                ];

                this.bassNotes = [
                    130.81, 0, 130.81, 0, 174.61, 0, 174.61, 0,
                    146.83, 0, 146.83, 0, 196.00, 0, 196.00, 0,
                    130.81, 0, 130.81, 0, 174.61, 0, 174.61, 0,
                    196.00, 0, 196.00, 0, 130.81, 0, 130.81, 0
                ];
            }

            init() {
                if (this.ctx) return;
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioCtx();

                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.value = 1.0;
                this.masterGain.connect(this.ctx.destination);

                this.musicGain = this.ctx.createGain();
                this.musicGain.gain.value = 0.0;
                this.musicGain.connect(this.masterGain);

                this.fxGain = this.ctx.createGain();
                this.fxGain.gain.value = 0.85;
                this.fxGain.connect(this.masterGain);

                this.rainGain = this.ctx.createGain();
                this.rainGain.gain.value = 0.0;
                this.rainGain.connect(this.masterGain);

                const bufferSize = this.ctx.sampleRate * 2;
                const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

                this.rainSource = this.ctx.createBufferSource();
                this.rainSource.buffer = noiseBuffer;
                this.rainSource.loop = true;

                const rainFilter = this.ctx.createBiquadFilter();
                rainFilter.type = 'lowpass';
                rainFilter.frequency.value = 1000;

                this.rainSource.connect(rainFilter);
                rainFilter.connect(this.rainGain);
                this.rainSource.start(0);
            }

            setRainActive(isActive) {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const now = this.ctx.currentTime;
                if (isActive) this.rainGain.gain.setTargetAtTime(0.35, now, 0.3);
                else if (this.rainGain) this.rainGain.gain.setTargetAtTime(0.0, now, 0.3);
            }

            playJumpSound() {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(680, now + 0.15);
                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.28, now + 0.03);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                osc.connect(gain);
                gain.connect(this.fxGain);
                osc.start(now);
                osc.stop(now + 0.2);
            }

            playDogBark() {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const playSingleBark = (delay, pitchMult) => {
                    setTimeout(() => {
                        if (!this.ctx) return;
                        const now = this.ctx.currentTime;
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(320 * pitchMult, now);
                        osc.frequency.exponentialRampToValueAtTime(540 * pitchMult, now + 0.04);
                        osc.frequency.exponentialRampToValueAtTime(260 * pitchMult, now + 0.12);
                        gain.gain.setValueAtTime(0.01, now);
                        gain.gain.linearRampToValueAtTime(0.35, now + 0.02);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
                        osc.connect(gain);
                        gain.connect(this.fxGain);
                        osc.start(now);
                        osc.stop(now + 0.15);
                    }, delay);
                };
                playSingleBark(0, 1.0);
                playSingleBark(130, 1.15);
            }

            playCatMeow() {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(580, now);
                osc.frequency.linearRampToValueAtTime(860, now + 0.14);
                osc.frequency.exponentialRampToValueAtTime(520, now + 0.38);
                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.28, now + 0.08);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.40);
                osc.connect(gain);
                gain.connect(this.fxGain);
                osc.start(now);
                osc.stop(now + 0.42);
            }

            playRooster() {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const now = this.ctx.currentTime;
                const notes = [
                    { f: 440, dur: 0.15 }, { f: 554, dur: 0.15 }, { f: 659, dur: 0.22 }, { f: 587, dur: 0.55 }
                ];
                let offset = 0;
                notes.forEach(n => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(n.f, now + offset);
                    osc.frequency.linearRampToValueAtTime(n.f * 1.08, now + offset + n.dur * 0.6);
                    gain.gain.setValueAtTime(0.001, now + offset);
                    gain.gain.linearRampToValueAtTime(0.18, now + offset + 0.03);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + offset + n.dur);
                    osc.connect(gain);
                    gain.connect(this.fxGain);
                    osc.start(now + offset);
                    osc.stop(now + offset + n.dur + 0.02);
                    offset += n.dur * 0.9;
                });
            }

            playBirdChirp() {
                if (!this.ctx || !this.isPlaying) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const baseF = 3000 + Math.random() * 1200;
                osc.type = 'sine';
                osc.frequency.setValueAtTime(baseF, now);
                osc.frequency.exponentialRampToValueAtTime(baseF * 1.45, now + 0.05);
                osc.frequency.exponentialRampToValueAtTime(baseF * 0.9, now + 0.11);
                osc.frequency.exponentialRampToValueAtTime(baseF * 1.3, now + 0.16);
                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.11, now + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.20);
                osc.connect(gain);
                gain.connect(this.musicGain);
                osc.start(now);
                osc.stop(now + 0.22);
            }

            playCicada() {
                if (!this.ctx || !this.isPlaying) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const mod = this.ctx.createOscillator();
                const modGain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(4800, now);
                mod.type = 'sine';
                mod.frequency.setValueAtTime(32, now);
                modGain.gain.setValueAtTime(800, now);
                mod.connect(modGain);
                modGain.connect(osc.frequency);
                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.08, now + 0.4);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
                osc.connect(gain);
                gain.connect(this.musicGain);
                mod.start(now);
                osc.start(now);
                mod.stop(now + 1.25);
                osc.stop(now + 1.25);
            }

            playCricket() {
                if (!this.ctx || !this.isPlaying) return;
                const now = this.ctx.currentTime;
                for (let k = 0; k < 3; k++) {
                    const startT = now + k * 0.06;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(4500, startT);
                    gain.gain.setValueAtTime(0.001, startT);
                    gain.gain.linearRampToValueAtTime(0.07, startT + 0.015);
                    gain.gain.exponentialRampToValueAtTime(0.001, startT + 0.045);
                    osc.connect(gain);
                    gain.connect(this.musicGain);
                    osc.start(startT);
                    osc.stop(startT + 0.05);
                }
            }

            scheduleNatureAmbience() {
                if (!this.isPlaying) return;
                if (currentHour >= 5.0 && currentHour < 8.0) this.playRooster();
                else if (currentHour >= 8.0 && currentHour < 11.5) this.playBirdChirp();
                else if (currentHour >= 11.5 && currentHour < 14.5) this.playCicada();
                else if (currentHour >= 14.5 && currentHour < 18.0) this.playBirdChirp();
                else this.playCricket();

                const nextDelay = 2200 + Math.random() * 2600;
                this.natureTimer = setTimeout(() => {
                    if (this.isPlaying) this.scheduleNatureAmbience();
                }, nextDelay);
            }

            playFireworkSound() {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const now = this.ctx.currentTime;

                const whistle = this.ctx.createOscillator();
                const whistleGain = this.ctx.createGain();
                whistle.type = 'sine';
                whistle.frequency.setValueAtTime(520, now);
                whistle.frequency.exponentialRampToValueAtTime(1800, now + 0.28);
                whistleGain.gain.setValueAtTime(0.01, now);
                whistleGain.gain.linearRampToValueAtTime(0.08, now + 0.08);
                whistleGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                whistle.connect(whistleGain);
                whistleGain.connect(this.fxGain);
                whistle.start(now);
                whistle.stop(now + 0.32);

                setTimeout(() => {
                    if (!this.ctx) return;
                    const boomNow = this.ctx.currentTime;
                    const boomOsc = this.ctx.createOscillator();
                    const boomGain = this.ctx.createGain();
                    boomOsc.type = 'triangle';
                    boomOsc.frequency.setValueAtTime(120, boomNow);
                    boomOsc.frequency.exponentialRampToValueAtTime(28, boomNow + 0.45);
                    boomGain.gain.setValueAtTime(0.4, boomNow);
                    boomGain.gain.exponentialRampToValueAtTime(0.001, boomNow + 0.5);
                    boomOsc.connect(boomGain);
                    boomGain.connect(this.fxGain);
                    boomOsc.start(boomNow);
                    boomOsc.stop(boomNow + 0.55);

                    const bufferSize = this.ctx.sampleRate * 0.35;
                    const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const output = noiseBuffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

                    const whiteNoise = this.ctx.createBufferSource();
                    whiteNoise.buffer = noiseBuffer;
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(900, boomNow);
                    filter.frequency.exponentialRampToValueAtTime(140, boomNow + 0.35);

                    const noiseGain = this.ctx.createGain();
                    noiseGain.gain.setValueAtTime(0.24, boomNow);
                    noiseGain.gain.exponentialRampToValueAtTime(0.001, boomNow + 0.35);

                    whiteNoise.connect(filter);
                    filter.connect(noiseGain);
                    noiseGain.connect(this.fxGain);
                    whiteNoise.start(boomNow);
                }, 300);
            }

            playPercussion(step) {
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                if (step % 4 === 0) {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(130, now);
                    osc.frequency.exponentialRampToValueAtTime(36, now + 0.1);
                    gain.gain.setValueAtTime(0.22, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                    osc.connect(gain);
                    gain.connect(this.musicGain);
                    osc.start(now);
                    osc.stop(now + 0.13);
                }
                if (step % 2 === 1) {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(2400, now);
                    gain.gain.setValueAtTime(0.018, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);
                    osc.connect(gain);
                    gain.connect(this.musicGain);
                    osc.start(now);
                    osc.stop(now + 0.04);
                }
            }

            playNote(freq, type, duration, vol, isPluck = false) {
                if (!this.ctx || freq <= 0) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, now);
                if (isPluck) {
                    gain.gain.setValueAtTime(0.01, now);
                    gain.gain.linearRampToValueAtTime(vol, now + 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
                } else {
                    gain.gain.setValueAtTime(vol, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                }
                osc.connect(gain);
                gain.connect(this.musicGain);
                osc.start(now);
                osc.stop(now + duration);
            }

            stepLoop() {
                if (!this.isPlaying) return;
                const stepTime = (60 / this.bpm) / 4;
                const mFreq = this.melodyNotes[this.currentStep % this.melodyNotes.length];
                if (mFreq > 0) {
                    this.playNote(mFreq, 'sine', stepTime * 1.3, 0.15, true);
                    this.playNote(mFreq * 0.5, 'triangle', stepTime * 1.1, 0.09, true);
                }
                const bFreq = this.bassNotes[this.currentStep % this.bassNotes.length];
                if (bFreq > 0) this.playNote(bFreq, 'triangle', stepTime * 2.0, 0.24, false);

                this.playPercussion(this.currentStep);
                this.currentStep = (this.currentStep + 1) % 32;

                this.timer = setTimeout(() => { this.stepLoop(); }, stepTime * 1000);
            }

            start() {
                this.init();
                if (this.ctx.state === 'suspended') this.ctx.resume();
                this.isPlaying = true;
                this.musicGain.gain.setTargetAtTime(0.45, this.ctx.currentTime, 0.1);
                this.stepLoop();
                this.scheduleNatureAmbience();
            }

            stop() {
                this.isPlaying = false;
                if (this.timer) clearTimeout(this.timer);
                if (this.natureTimer) clearTimeout(this.natureTimer);
                if (this.ctx && this.musicGain) this.musicGain.gain.setTargetAtTime(0.001, this.ctx.currentTime, 0.1);
            }
        }

        const SKY_TIMELINE = [

            { h: 4.5,  sky: 0x0a1128, sun: 0x1e293b, lightInt: 0.15, ambInt: 0.20, windowGlow: 0.85, starOp: 0.9 },

        ];

        function getSkyLerp(hour) {
            let idx = 0;
            for (let i = 0; i < SKY_TIMELINE.length - 1; i++) {
                if (hour >= SKY_TIMELINE[i].h && hour <= SKY_TIMELINE[i + 1].h) {
                    idx = i;
                    break;
                }
            }
            const p1 = SKY_TIMELINE[idx];
            const p2 = SKY_TIMELINE[idx + 1];
            const t = (hour - p1.h) / (p2.h - p1.h);

            const cSky = _colorA.setHex(p1.sky).lerp(_colorB.setHex(p2.sky), t);
            const cSun = _colorB.setHex(p1.sun).lerp(_colorC.setHex(p2.sun), t);
            let lightInt = THREE.MathUtils.lerp(p1.lightInt, p2.lightInt, t);
            let ambInt = THREE.MathUtils.lerp(p1.ambInt, p2.ambInt, t);
            let winGlow = THREE.MathUtils.lerp(p1.windowGlow, p2.windowGlow, t);
            let starOp = THREE.MathUtils.lerp(p1.starOp, p2.starOp, t);

            if (currentWeather === 'CLOUDY') {
                cSky.lerp(_colorC.setHex(0x64748b), 0.35);
                lightInt *= 0.75; ambInt *= 0.85; starOp *= 0.3;
            } else if (currentWeather === 'RAINBOW') {
                cSky.lerp(_colorC.setHex(0xa5f3fc), 0.25);
                lightInt *= 1.15; ambInt *= 1.1;
            } else if (currentWeather === 'FIREWORK' || currentWeather === 'METEOR') {
                cSky.setHex(0x050814);
                lightInt = 0.12; ambInt = 0.22; winGlow = 0.85; starOp = 1.0;
            } else if (currentWeather === 'RAINY') {
                cSky.lerp(_colorC.setHex(0x334155), 0.6);
                cSun.setHex(0x94a3b8);
                lightInt *= 0.45; ambInt *= 0.65; winGlow = Math.max(winGlow, 0.4); starOp = 0.0;
            } else if (currentWeather === 'SNOWY') {
                cSky.lerp(_colorC.setHex(0x94a3b8), 0.5);
                lightInt *= 0.65; ambInt *= 0.95; starOp *= 0.2;
            }
            return { cSky, cSun, lightInt, ambInt, winGlow, starOp };
        }

        function updateSkyAndLighting(hour) {
            const data = getSkyLerp(hour);
            // 克隆天空色以避免后续复用向量污染 scene.background 引用
            scene.background = data.cSky.clone();
            const fogDensity = (currentWeather === 'RAINY' || currentWeather === 'SNOWY') ? 0.007 : 0.0035;
            scene.fog = new THREE.FogExp2(data.cSky.getHex(), fogDensity);

            const sunAngle = (hour / 24) * Math.PI * 2 - Math.PI / 2;
            const celestialDist = 135;
            const sunX = Math.cos(sunAngle) * celestialDist;
            const sunY = Math.sin(sunAngle) * celestialDist;
            const sunZ = -20 + Math.sin(sunAngle * 0.5) * 35;

            sunLight.position.set(sunX, sunY, sunZ);
            sunLight.color = data.cSun;
            sunLight.intensity = data.lightInt;
            ambientLight.intensity = data.ambInt;

            sunGroup.position.set(sunX, sunY, sunZ);
            sunGroup.visible = (sunY > -10) && (currentWeather !== 'RAINY') && (currentWeather !== 'FIREWORK') && (currentWeather !== 'METEOR');

            const moonAngle = sunAngle + Math.PI;
            const moonX = Math.cos(moonAngle) * celestialDist;
            const moonY = Math.sin(moonAngle) * celestialDist;
            const moonZ = -20 + Math.sin(moonAngle * 0.5) * 35;

            moonGroup.position.set(moonX, moonY, moonZ);
            moonGroup.visible = (moonY > -10) && (currentWeather !== 'RAINY');
            moonGroup.lookAt(0, 0, 0);

            if (data.winGlow > 0.01) {
                matInstances.WINDOW_DARK.emissive.setHex(0xfef08a);
